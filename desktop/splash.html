<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>MessMate</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #050505;
      color: #f5f4ed;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    .brand { display: flex; flex-direction: column; align-items: center; gap: 15px; }
    .mark {
      width: 112px;
      height: 66px;
      opacity: 0;
      transform: scale(.86);
      animation: mark-in .36s cubic-bezier(.2,.8,.2,1) .04s forwards;
    }
    .name {
      font-size: 27px;
      font-weight: 650;
      letter-spacing: -.8px;
      opacity: 0;
      transform: translateY(6px);
      animation: name-in .36s ease .24s forwards;
    }
    @keyframes mark-in { to { opacity: 1; transform: scale(1); } }
    @keyframes name-in { to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      .mark, .name { animation-duration: .01ms; animation-delay: 0ms; }
    }
  </style>
</head>
<body>
  <main class="brand" aria-label="MessMate starting">
    <svg class="mark" viewBox="0 0 160 94" role="img" aria-label="MM logo" xmlns="http://www.w3.org/2000/svg">
      <path d="M8 84V10H26L57 46L88 10H106V84H87V39L57 73L27 39V84Z" fill="#F5F4ED"/>
      <path d="M70 84V10H88L119 46L150 10H152V84H133V39L119 55L88 84Z" fill="#B9D957"/>
    </svg>
    <div class="name">MessMate</div>
  </main>
</body>
</html>
