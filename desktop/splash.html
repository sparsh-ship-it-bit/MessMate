<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>MessMate</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #050805;
      color: #f5f5f0;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    .brand {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 17px;
      padding: 28px;
    }
    .intro {
      height: 112px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      animation: intro-exit .5s ease-in 1.05s forwards;
    }
    .intro span {
      display: block;
      font-size: 92px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -9px;
      opacity: 0;
      text-shadow: 0 0 28px rgba(198,255,0,.12);
    }
    .intro .m-one {
      color: #f5f5f0;
      animation: m-left .7s cubic-bezier(.2,.8,.2,1) .08s forwards;
    }
    .intro .m-two {
      color: #c6ff00;
      animation: m-right .7s cubic-bezier(.2,.8,.2,1) .08s forwards;
    }
    .name {
      margin-top: -129px;
      font-size: 34px;
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: -.9px;
      white-space: nowrap;
      opacity: 0;
      transform: translateY(5px) scale(.97);
      animation: name-reveal .52s cubic-bezier(.2,.8,.2,1) 1.28s forwards;
    }
    .name span { color: #c6ff00; }
    .tagline {
      margin-top: -7px;
      color: #7f8875;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 3.1px;
      text-transform: uppercase;
      opacity: 0;
      animation: fade-in .4s ease-out 1.58s forwards;
    }
    .loader {
      display: flex;
      gap: 6px;
      margin-top: 13px;
    }
    .loader span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #c6ff00;
      opacity: .25;
      animation: wave 1s ease-in-out 1.9s infinite;
    }
    .loader span:nth-child(2) { animation-delay: 2.05s; }
    .loader span:nth-child(3) { animation-delay: 2.2s; }
    @keyframes m-left {
      0% { opacity: 0; transform: translateX(-34px) scale(.8); }
      65% { opacity: 1; transform: translateX(5px) scale(1.04); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }
    @keyframes m-right {
      0% { opacity: 0; transform: translateX(34px) scale(.8); }
      65% { opacity: 1; transform: translateX(-5px) scale(1.04); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }
    @keyframes intro-exit {
      to { opacity: 0; transform: translateY(-5px) scale(.88); visibility: hidden; }
    }
    @keyframes name-reveal {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes fade-in { to { opacity: 1; } }
    @keyframes wave {
      0%, 60%, 100% { opacity: .25; transform: translateY(0) scale(.8); }
      30% { opacity: 1; transform: translateY(-5px) scale(1.2); }
    }
    @media (prefers-reduced-motion: reduce) {
      .intro, .intro span, .name, .tagline, .loader span {
        animation-duration: .01ms;
        animation-delay: 0ms;
      }
    }
  </style>
</head>
<body>
  <main class="brand" aria-label="MessMate starting">
    <div class="intro" aria-hidden="true"><span class="m-one">M</span><span class="m-two">M</span></div>
    <div class="name">Mess<span>Mate</span></div>
    <div class="tagline">Mess management, simplified</div>
    <div class="loader" role="status" aria-label="Loading"><span></span><span></span><span></span></div>
  </main>
</body>
</html>
