<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>MessMate</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #050505;
      color: #f5f5f0;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    .brand {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 28px;
    }
    .mark {
      display: block;
      width: min(224px, 64vw);
      height: auto;
      aspect-ratio: 256 / 128;
      opacity: 0;
      transform: translateY(5px);
      animation: enter .4s ease-out .04s forwards;
    }
    .name {
      font-size: clamp(28px, 7vw, 36px);
      line-height: 1.15;
      font-weight: 650;
      letter-spacing: -.9px;
      white-space: nowrap;
      opacity: 0;
      transform: translateY(5px);
      animation: enter .4s ease-out .14s forwards;
    }
    .name span { color: #39d353; }
    @keyframes enter { to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      .mark, .name { animation-duration: .01ms; animation-delay: 0ms; }
    }
  </style>
</head>
<body>
  <main class="brand" aria-label="MessMate starting">
    <svg class="mark" viewBox="0 0 256 128" role="img" aria-label="Two distinct M letters" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#b7ff43"/>
          <stop offset="1" stop-color="#00b83f"/>
        </linearGradient>
      </defs>
      <path d="M10 118V10H31L65 51L99 10H120V118H96V48L65 85L34 48V118Z" fill="#F5F5F0"/>
      <path d="M136 118V10H157L191 51L225 10H246V118H222V48L191 85L160 48V118Z" fill="url(#green)"/>
    </svg>
    <div class="name">Mess<span>Mate</span></div>
  </main>
</body>
</html>
