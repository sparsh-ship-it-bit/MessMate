name: Build MessMate Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set version from release tag
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          sed -i -E "s/versionCode = [0-9]+/versionCode = $CODE/; s/versionName = \"[^\"]+\"/versionName = \"$VERSION\"/" android/app/build.gradle.kts

      - name: Decode stable release signing key
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          MESSMATE_KEYSTORE_BASE64: ${{ secrets.MESSMATE_KEYSTORE_BASE64 }}
        run: |
          test -n "$MESSMATE_KEYSTORE_BASE64" || (echo "Missing MESSMATE_KEYSTORE_BASE64 repository secret" && exit 1)
          mkdir -p "$RUNNER_TEMP/messmate-signing"
          echo "$MESSMATE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/messmate-signing/messmate-release.jks"
          echo "MESSMATE_KEYSTORE_PATH=$RUNNER_TEMP/messmate-signing/messmate-release.jks" >> "$GITHUB_ENV"
          echo "MESSMATE_KEY_ALIAS=messmate-release" >> "$GITHUB_ENV"
          echo "MESSMATE_KEYSTORE_PASSWORD=${{ secrets.MESSMATE_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "MESSMATE_KEY_PASSWORD=${{ secrets.MESSMATE_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build installable APK
        working-directory: android
        run: |
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            test -n "$MESSMATE_KEYSTORE_PASSWORD" || (echo "Missing MESSMATE_KEYSTORE_PASSWORD repository secret" && exit 1)
            gradle :app:assembleRelease --no-daemon
          else
            gradle :app:assembleDebug --no-daemon
          fi

      - name: Prepare APK
        run: |
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            cp android/app/build/outputs/apk/release/app-release.apk MessMate-Android.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk MessMate-Android.apk
          fi

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MessMate-Android-APK
          path: MessMate-Android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          name: MessMate ${{ github.ref_name }}
          generate_release_notes: true
          files: MessMate-Android.apk
