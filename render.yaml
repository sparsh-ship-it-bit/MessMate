services:
  - type: web
    name: messmate
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: messmate-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL_HOURS
        value: "24"

databases:
  - name: messmate-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
