services:
  - type: web
    name: messmate
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: messmate-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL_HOURS
        value: "720"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: APP_BASE_URL
        value: https://messmate-zhms.onrender.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: FEEDBACK_EMAIL
        sync: false

databases:
  - name: messmate-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
